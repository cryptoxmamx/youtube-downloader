<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Checker</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #2563eb;
            --accent-hover: #3b82f6;
            --success: #10b981;
            --error: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 600px; background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(16px); border-radius: 24px; padding: 40px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }
        h1 { font-size: 2rem; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.05em; }
        p.subtitle { color: var(--text-muted); margin-bottom: 30px; font-size: 0.95rem; }
        .search-box { display: flex; gap: 12px; }
        input[type="text"] { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); padding: 16px 20px; border-radius: 14px; color: var(--text-main); font-size: 1rem; outline: none; transition: all 0.3s ease; }
        input[type="text"]:focus { border-color: var(--accent); }
        button { background: var(--accent); color: white; border: none; padding: 0 28px; border-radius: 14px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: background 0.2s ease; }
        button:hover { background: var(--accent-hover); }
        .result-container { margin-top: 30px; border-radius: 14px; padding: 20px; display: none; }
        .result-container.available { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); }
        .result-container.taken { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); }
        .result-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 6px; }
        .available .result-title { color: var(--success); }
        .taken .result-title { color: var(--error); }
        .result-details { font-size: 0.9rem; color: var(--text-muted); }
        .loader { display: none; color: var(--text-muted); font-size: 0.9rem; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Domain Checker</h1>
        <p class="subtitle">Enter your domain name to check availability instantly.</p>
        <div class="search-box">
            <input type="text" id="domainInput" placeholder="example.store" autocomplete="off">
            <button id="searchBtn">Check</button>
        </div>
        <div class="loader" id="loader">Checking registration availability...</div>
        <div class="result-container" id="resultBox">
            <div class="result-title" id="resultTitle"></div>
            <div class="result-details" id="resultDetails"></div>
        </div>
    </div>
    <script>
        const searchBtn = document.getElementById('searchBtn');
        const domainInput = document.getElementById('domainInput');
        const loader = document.getElementById('loader');
        const resultBox = document.getElementById('resultBox');
        const resultTitle = document.getElementById('resultTitle');
        const resultDetails = document.getElementById('resultDetails');

        searchBtn.addEventListener('click', checkDomain);
        domainInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkDomain(); });

        async function checkDomain() {
            const domain = domainInput.value.trim();
            if (!domain || !domain.includes('.')) return alert("Please enter a valid domain name.");

            resultBox.style.display = 'none';
            loader.style.display = 'block';

            try {
                const response = await fetch(`/api/check?domain=${encodeURIComponent(domain)}`);
                const data = await response.json();
                loader.style.display = 'none';

                if (!response.ok) return alert(`System Error: ${data.error || 'Failed setup'}`);
                displayResult(data);
            } catch (error) {
                loader.style.display = 'none';
                alert("Network communication error.");
            }
        }

        function displayResult(data) {
            resultBox.style.display = 'block';
            resultBox.className = 'result-container ' + (data.available ? 'available' : 'taken');
            resultTitle.innerHTML = data.available ? `✓ ${data.domain} is available!` : `✕ ${data.domain} is taken`;
            resultDetails.innerHTML = data.available && data.price ? `Price: ${(data.price / 1000000).toFixed(2)} ${data.currency || 'USD'}` : '';
        }
    </script>
</body>
</html>
